<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Keuangan - Status Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --success: #10b981;
      --glow: rgba(99, 102, 241, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: var(--primary);
      filter: blur(150px);
      opacity: 0.12;
      z-index: 0;
    }

    body::before {
      top: -10%;
      left: -10%;
    }

    body::after {
      bottom: -10%;
      right: -10%;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 80px var(--glow);
    }

    .logo-area {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }

    .logo-area svg {
      width: 40px;
      height: 40px;
      fill: #fff;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #d1d5db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-weight: 300;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--success);
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--success);
      animation: pulse 2s infinite;
    }

    .details {
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .detail-label {
      color: var(--text-muted);
      font-weight: 300;
    }

    .detail-value {
      font-weight: 600;
      color: var(--text-main);
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="logo-area">
        <!-- Minimalist wallet icon -->
        <svg viewBox="0 0 24 24">
          <path d="M21,18v1c0,1.1-0.9,2-2,2H5c-1.11,0-2-0.9-2-2V5c0-1.1,0.89-2,2-2h14c1.1,0,2,0.9,2,2v1h-9c-1.11,0-2,0.9-2,2v8 c0,1.1,0.89,2,2,2H21z M12,16h10V8H12V16z M16,13.5c-0.83,0-1.5-0.67-1.5-1.5s0.67-1.5,1.5-1.5s1.5,0.67,1.5,1.5S16.83,13.5,16,13.5z"/>
        </svg>
      </div>
      
      <h1>Bot Keuangan</h1>
      <p class="subtitle">Sistem Pencatatan Keuangan BEM</p>

      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Sistem Online (Serverless)</span>
      </div>

      <div class="details">
        <div class="detail-item">
          <span class="detail-label">Platform</span>
          <span class="detail-value">Vercel Serverless</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Engine</span>
          <span class="detail-value">Node.js (grammY)</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Database</span>
          <span class="detail-value">Google Sheets API</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
